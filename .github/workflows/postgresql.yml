name: PostgreSQL operational wiring
on:
  pull_request:
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      # Producao roda Postgres 17.6.1 (Supabase project "leadhunter", ref
      # afalsydsmwijdupqkvqb). A versao aqui precisa acompanhar isso -- validar
      # contra 16 nao prova nada sobre comportamento especifico do 17.
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: git diff --check (no conflict markers / trailing whitespace)
        run: |
          git fetch origin main
          git diff --check origin/main...HEAD
      - run: bash scripts/verify-migrations.sh
